[project]
name = "devoirs-padlet"
version = "1.0.0"
description = "Add-on Home Assistant : devoirs publiés sur le Padlet de la classe vers une liste de tâches HA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
]

[project.optional-dependencies]
scheduler = [
    "apscheduler>=3.10.0,<4",
]

[project.scripts]
devoirs = "devoirs_padlet.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devoirs_padlet"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]

[dependency-groups]
dev = ["pytest>=8"]
